name: Demo (GitHub Pages)

# Publishes the *demonstration* build of the web app on GitHub Pages.
#
# Mission 24: `main` is the only publication source, and only after an approved
# merge. Arena branches and pull requests run the same typecheck, tests and
# demo build but never upload or deploy the public artifact. A manual dispatch
# is also restricted to `main`. The page is a 100 % client-side simulation
# (fictional data in the browser, no database, no API key, no server call).

on:
  push:
    branches:
      - main
      # Arena branches build and test the demo but never publish it: the
      # deployment condition below requires refs/heads/main.
      - 'arena/**'
    paths:
      - 'apps/web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build demo bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck web
        run: npm run typecheck -w @mc/web

      - name: Web tests (demo backend + screens, jsdom)
        run: npm run test -w @mc/web

      - name: Build demo (base=/mauritius-compta/)
        run: npm run build:demo
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BUILD_COMMIT: ${{ github.sha }}

      # Mission 31: the verifier follows every JS chunk reachable from
      # index.html (Mission 30 moved the demo engine to runtime-*.js) and
      # validates the base path, PWA assets and fictional samples. It prints an
      # explicit `::error` with the control, resource and HTTP status on failure.
      - name: Verify the demo bundle (dynamic chunks, PWA, samples, no MBS brand)
        run: >-
          node scripts/verify-demo.mjs
          --dist apps/web/dist
          --base /mauritius-compta/
          --expect-commit "$GITHUB_SHA"

      # The public site is a demo build, but the same source must stay able to
      # produce a real bundle without demo fixtures, credentials or runtime chunk.
      - name: Build real bundle for demo/real separation check
        working-directory: apps/web
        run: npx vite build --outDir dist-real
        env:
          VITE_DEMO_MODE: 'false'
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Verify the real bundle excludes demo data
        run: node scripts/verify-demo.mjs --real-dist apps/web/dist-real

      - name: Scan the demo bundle for secrets
        run: |
          set -euo pipefail
          # No provider key and no private key may ever reach the public demo.
          if grep -RIlE 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' apps/web/dist; then
            echo "::error::A secret-like value was found in the demo bundle."
            exit 1
          fi
          echo "OK: aucun secret détecté dans le bundle de démonstration"

      - uses: actions/upload-pages-artifact@v3
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    # Deployment is restricted to `main` above: a pull request or an Arena
    # branch can never replace the public demo. Permissions below are what
    # deploy-pages needs.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # The verifier lives in the repository, so this job needs its own checkout
      # (the build artifact contains only the web dist directory).
      - uses: actions/checkout@v4

      # `enablement: true` creates the Pages site on the first run when the
      # repository does not have it yet (source: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4

      # End-to-end proof, executed from GitHub's network (the assistant sandbox
      # cannot reach *.github.io): the verifier follows index.html, every
      # JavaScript chunk (including runtime-*.js), the manifest, icons, sw.js,
      # the 404 fallback and the fictional samples. It retries the initial page
      # for GitHub Pages propagation, then fails with an explicit `::error`.
      - name: Verify the published HTTPS URL
        env:
          PAGES_BASE_URL: https://azharshahim.github.io/mauritius-compta/
        run: |
          set -euo pipefail
          node scripts/verify-demo.mjs \
            --url "$PAGES_BASE_URL" \
            --base /mauritius-compta/ \
            --expect-commit "$GITHUB_SHA" \
            --wait 180
