name: Integration browser journeys
on:
  push:
    branches: [integration/m42-m43-m44]
  pull_request:
    branches: [main]
concurrency:
  group: integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/integration/m42-m43-m44' || github.head_ref == 'integration/m42-m43-m44'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build:demo
      - name: Desktop and Pixel 7 journeys
        run: |
          VITE_DEMO_MODE=true npm run preview -w @mc/web -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          E2E_BASE_URL=http://127.0.0.1:4173/mauritius-compta/ npm run test:e2e -w @mc/web -- mission44-workspace.spec.ts --timeout=30000 --reporter=list,github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-browser-results
          path: apps/web/test-results
  migration-compatibility:
    if: github.ref == 'refs/heads/integration/m42-m43-m44' || github.head_ref == 'integration/m42-m43-m44'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mc_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: mauritius_compta_m45_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w @mc/api -- tests/mission44-migration-compat.test.ts
        env:
          TEST_MIGRATION_DATABASE_URL: postgresql://mc_user:ci_only_password@127.0.0.1:5432/mauritius_compta_m45_test
